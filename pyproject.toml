[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "exex"
description = 'Explicit experiment execution on local machines and Slurm clusters'
readme = "README.md"
requires-python = ">=3.10.12,<3.13,!=3.11.0,!=3.11.1,!=3.11.2,!=3.11.3"
license = {text = "MIT"}
keywords = ["machine-learning", "hpc", "packaging", "singularity"]
authors = [{ name = "Yicheng Luo", email = "ethanluoyc@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

dependencies = [
    "absl-py",
    "attrs",
    "ml_collections",
    "tomlkit",
    "paramiko",
    "fabric",
    "appdirs",
    "fsspec",
    "async_generator",
    "immutabledict",
    "rich",
    "vcsinfo",
    "docker",
    "pip",
    "shelved-cache>=0.3.1",
    "cachetools>=5.3.2",
]

[project.urls]
homepage = "https://github.com/youngsm/exex"
documentation = "https://github.com/youngsm/exex/tree/main/docs"
repository = "https://github.com/youngsm/exex"

[project.scripts]
exex = "exex.cli.cli:entrypoint"

[project.optional-dependencies]
# The qualified SDK; later releases removed APIs used by this integration.
wandb = ["wandb==0.28.0"]
shell = ["IPython"]
pex = [
    "pex>2.1.139",
]

[tool.pdm.dev-dependencies]
dev = [
    "coverage[toml]>=6.5",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "fabric",
    "Sphinx",
    "myst-parser",
    "black>=23.1.0",
    "ruff>=0.0.243",
    "pytest-golden>=0.2.2",
]

[tool.pdm.version]
source = "scm"

[tool.pdm.build]
source-includes = ["tests"]
excludes = ["**/*_test.py"]

[tool.pdm.scripts]
test = "pytest exex tests"
test-cov = "pytest --cov=exex --cov-report=xml tests"
cov = {composite = ["test-cov", "coverage report"]}
docs = "sphinx-build -b html docs docs/build/html -j auto"
lint.shell = "ruff check ."
fmt.shell = "ruff format ."
typecheck.shell = "pyright"

[tool.ruff]
exclude = ["_vendor", "xm", ".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
]
ignore = ["E501"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["exex"]
force-single-line = true
single-line-exclusions = ["typing"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.paths]
source = ["exex", "*/exex/exex"]

[tool.coverage.run]
omit = [
  "exex/_vendor/*",
  "tests/*",
  "conftest.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
omit = [
  "exex/experimental/*",
  "exex/xm_cluster/packaging/digest_util.py"
]

[tool.pyright]
include = ["exex"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "exex/xm",
  "exex/_vendor",
]
ignore = [
  "exex/xm_cluster/executable_specs.py"
]

reportMissingImports = true
reportMissingTypeStubs = false

pythonVersion = "3.10"
pythonPlatform = "Linux"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
  "tests",
  "exex/_vendor",
]
markers = [
  "integration",
]
addopts = "--import-mode=importlib"
enable_assertion_pass_hook = true
filterwarnings = [
  # xm/core_test.py
  "ignore:cannot collect test class 'TestError':pytest.PytestCollectionWarning",
]
